const bg=document.getElementById("bg");bg.muted=true;
const cv=document.getElementById("canvas"),ctx=cv.getContext("2d");
const W=cv.width,H=cv.height,GY=420,DW=140,DH=190;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let dino,obs,speed,score,best=0,dead,started,frames,nextSpawn;

function reset(){
  dino={x:70,y:GY-DH,vy:0,jumping:false};
  obs=[];speed=8;score=0;dead=false;frames=0;nextSpawn=70;
}
reset();started=false;

function jump(){
  bg.muted=true;if(bg.paused)bg.play().catch(()=>{});
  if(dead){reset();started=true;return;}
  started=true;
  if(!dino.jumping){
    dino.jumping=true;dino.vy=-24;
    playSound(jumpSound);          // first audio: jump
  }
}
addEventListener("keydown",e=>{
  if(e.code==="Space"||e.code==="ArrowUp"){e.preventDefault();if(!e.repeat)jump();}
});
document.addEventListener("pointerdown",e=>{e.preventDefault();jump();});   // click anywhere

function update(){
  if(!started||dead)return;
  frames++;score+=speed/50;speed=8+score/120;
  dino.vy+=1.3;dino.y+=dino.vy;
  if(dino.y>=GY-DH){dino.y=GY-DH;dino.vy=0;dino.jumping=false;}
  if(--nextSpawn<=0){
    const h=60+Math.random()*50,w=30+Math.random()*24;
    obs.push({x:W+20,w,h});
    nextSpawn=Math.max(50,90+Math.random()*70-speed*3);
  }
  obs.forEach(o=>o.x-=speed);
  obs=obs.filter(o=>o.x+o.w>-20);
  for(const o of obs){
    const hit=dino.x+28<o.x+o.w&&dino.x+DW-28>o.x&&dino.y+DH>GY-o.h&&dino.y+20<GY;
    if(hit&&!dead){
      dead=true;best=Math.max(best,Math.floor(score));
      playSound(dieSound);         // second audio: dino dies
    }
  }
}

function draw(){
  const ink=css("--ink"),gr=css("--ground");
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=gr;ctx.fillRect(0,GY,W,3);
  for(let i=0;i<24;i++){ctx.fillRect(((i*131-frames*speed*.6)%W+W)%W,GY+14+(i%3)*14,16+i%4*8,3);}
  ctx.fillStyle=ink;
  obs.forEach(o=>{ctx.fillRect(o.x,GY-o.h,o.w,o.h);ctx.fillRect(o.x-12,GY-o.h*.65,12,8);ctx.fillRect(o.x+o.w,GY-o.h*.5,12,8);});
  const bob=(!dead&&started&&!dino.jumping)?Math.sin(frames*.4)*4:0;
  if(img.complete)ctx.drawImage(img,dino.x,dino.y+bob,DW,DH);
  ctx.fillStyle=ink;ctx.font="bold 28px Georgia";ctx.textAlign="right";
  ctx.fillText("HI "+String(best).padStart(5,"0")+"   "+String(Math.floor(score)).padStart(5,"0"),W-20,44);
  ctx.textAlign="center";
  if(!started){ctx.fillText("Click anywhere to start",W/2,170);}
  if(dead){ctx.font="bold 64px Georgia";ctx.fillText("Sorry my daddy",W/2,170);ctx.font="24px Georgia";ctx.fillText("Click anywhere to try again",W/2,215);}
}
(function loop(){update();draw();requestAnimationFrame(loop);})();
</script>
